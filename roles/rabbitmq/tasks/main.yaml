- name: copy rabbitmq repo
  copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo
- name: install rabbitmq
  package:
    name: 
      - erlang
      - rabbitmq-server
    state: present

- name: install botocore and boto3
  ansible.builtin.pip:
    name:
      - boto3
      - botocore
    state: present
    executable: pip3.9
    
- name: start and enable rabbitmq server
  service:
    name: rabbitmq-server
    state: started
    enabled: yes


- name: adding rabbitmq user and set password 
  community.rabbitmq.rabbitmq_user:
    user: "{{rabbitmq_user}}"
    password: "{{rabbitmq_password}}"
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    state: present